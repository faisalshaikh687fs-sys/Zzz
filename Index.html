<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNO No Mercy Online</title>
<style>
:root{--bg:#14141c;--fg:#f4f4f8;--mut:#9a9ab0;--pan:#22222e;--R:#e53935;--Y:#f9a825;--G:#43a047;--B:#1e88e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#14141c}}
*{box-sizing:inherit}html,body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100%;padding:12px;max-width:760px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px;letter-spacing:1px}h1 b{color:var(--R)}
.card-box{background:var(--pan);border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:var(--fg);font-size:16px;margin:6px 0}
button{background:#3b3b52;color:var(--fg);border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}
button.pri{background:var(--R);font-weight:700}button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.code{font-size:34px;letter-spacing:6px;font-weight:800;text-align:center}
.mut{color:var(--mut);font-size:14px}
.opps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.opp{background:var(--pan);border-radius:10px;padding:6px 10px;font-size:14px;border:2px solid transparent}
.opp.turn{border-color:#fff}.opp.out{opacity:.35;text-decoration:line-through}
.opp.warn b{color:#ff7043}
.table{display:flex;gap:18px;align-items:center;justify-content:center;margin:10px 0}
.c{width:62px;height:92px;border-radius:9px;border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;flex:none;user-select:none;text-shadow:0 1px 2px #0006}
.c.W{background:linear-gradient(135deg,var(--R) 25%,var(--Y) 25% 50%,var(--G) 50% 75%,var(--B) 75%)}
.c.R{background:var(--R)}.c.Y{background:var(--Y)}.c.G{background:var(--G)}.c.B{background:var(--B)}
.c.back{background:#111;color:var(--R);font-size:16px}
.big{width:84px;height:124px;font-size:32px}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hand .c{cursor:pointer}.hand .c.no{opacity:.4}
.hand .c.ok{transform:translateY(-6px);box-shadow:0 0 0 2px #fff8}
.info{text-align:center;min-height:24px;margin:6px 0;font-weight:600}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;border:2px solid #fff}
.log{font-size:13px;color:var(--mut);max-height:84px;overflow:auto;margin-top:8px}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}
.ov>div{background:var(--pan);padding:18px;border-radius:14px;min-width:250px;text-align:center}
.cb{width:64px;height:64px;border-radius:12px;margin:5px;border:3px solid #fff}
</style></head><body>
<h1>UNO <b>NO MERCY</b> · online</h1>
<div id="app"></div><div id="ov"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const COL={R:'Red',Y:'Yellow',G:'Green',B:'Blue'};
const LAB={S:'⊘',A:'⊘⊘',R:'⇄',D2:'+2',D4:'+4',X:'✖',WR4:'⇄+4',W6:'+6',W10:'+10',RL:'🎨'};
const P=c=>c.split('|'),dv=v=>({D2:2,D4:4,WR4:4,W6:6,W10:10})[v]||0;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=id=>document.getElementById(id);
let uid,name=localStorage.getItem?.('unoName')||'',code='',G=null,unsub=null,msg='';
try{name=localStorage.getItem('unoName')||''}catch(e){}

function mkDeck(){const d=[];for(const c of'RYGB')for(let i=0;i<2;i++){for(let n=0;n<10;n++)d.push(c+'|'+n);for(const v of['S','A','R','D2','D4','X'])d.push(c+'|'+v)}
for(let i=0;i<4;i++)d.push('W|WR4','W|W6','W|W10','W|RL');return shuf(d)}
const act=g=>g.players.filter(p=>!p.out);
function nxt(g,i,n=1){const L=g.players.length;while(n-->0){do{i=(i+g.dir+L)%L}while(g.players[i].out)}return i}
function canPlay(g,card){const[c,v]=P(card),t=P(g.disc[g.disc.length-1]);
 if(g.pick)return false;if(g.pend)return dv(v)>0&&dv(v)>=g.pendVal;return c==='W'||c===g.color||v===t[1]}
function drawN(g,p,n){for(;n>0;n--){if(!g.deck.length){const t=g.disc.pop();g.deck=shuf(g.disc);g.disc=[t]}if(!g.deck.length)break;p.hand.push(g.deck.pop())}}
function mercy(g){for(const p of g.players)if(!p.out&&p.hand.length>=25){p.out=1;g.deck.unshift(...p.hand);p.hand=[];g.log.push('💀 '+p.name+' hit 25 cards – eliminated!')}
 const a=act(g);if(a.length===1){g.phase='over';g.winner=a[0].id}
 else if(g.players[g.turn].out)g.turn=nxt(g,g.turn)}
function startGame(g){g.deck=mkDeck();g.disc=[];g.players.forEach(p=>{p.hand=[];p.out=0;drawN(g,p,7)});
 let i=g.deck.findIndex(c=>c[0]!=='W'&&/^\d$/.test(P(c)[1]));g.disc.push(g.deck.splice(i,1)[0]);
 g.color=P(g.disc[0])[0];g.turn=0;g.dir=1;g.pend=0;g.pendVal=0;g.pick=null;g.phase='play';g.winner=null;g.log=['Game started!']}

function apply(g0,me,a){const g=JSON.parse(JSON.stringify(g0)),p=g.players[g.turn];
 if(g.phase!=='play')return g;
 if(a.t==='pickcol'){const pk=g.players[g.pick?.who];if(!pk||pk.id!==me)return g;let n=0;
  while(n<60){const b=pk.hand.length;drawN(g,pk,1);if(pk.hand.length===b)break;n++;if(P(pk.hand[pk.hand.length-1])[0]===a.col)break}
  g.color=a.col;g.pick=null;g.log.push(pk.name+' picked '+COL[a.col]+' and drew '+n);g.turn=nxt(g,g.turn);mercy(g);return g}
 if(p.id!==me||g.pick)return g;
 if(a.t==='draw'){
  if(g.pend){drawN(g,p,g.pend);g.log.push(p.name+' drew '+g.pend);g.pend=0;g.pendVal=0;g.turn=nxt(g,g.turn)}
  else{if(p.hand.some(c=>canPlay(g,c)))return g;let n=0;
   while(n<40){const b=p.hand.length;drawN(g,p,1);if(p.hand.length===b)break;n++;if(canPlay(g,p.hand[p.hand.length-1]))break}
   g.log.push(p.name+' drew '+n);if(!p.hand.some(c=>canPlay(g,c)))g.turn=nxt(g,g.turn)}
  mercy(g);return g}
 if(a.t==='play'){const card=p.hand[a.i];if(!card||!canPlay(g,card))return g;const[c,v]=P(card);
  p.hand.splice(a.i,1);
  if(v==='X'){const s=p.hand.filter(x=>P(x)[0]===c);p.hand=p.hand.filter(x=>P(x)[0]!==c);g.disc.push(...s)}
  g.disc.push(card);if(c!=='W')g.color=c;else if(v!=='RL')g.color=a.col||'R';
  g.log.push(p.name+' played '+(c==='W'?'':COL[c]+' ')+LAB[v]||v);
  if(!p.hand.length){g.phase='over';g.winner=p.id;return g}
  let adv=1;const d=dv(v);if(d){g.pend+=d;g.pendVal=d}
  if(v==='R'||v==='WR4'){g.dir*=-1;if(act(g).length===2)adv=0}
  if(v==='S')adv=2;if(v==='A')adv=0;
  if(v==='7'&&a.tgt!=null){const t=g.players[a.tgt];if(t&&!t.out&&t!==p){[p.hand,t.hand]=[t.hand,p.hand]}}
  if(v==='0'){const ids=[];let i=g.turn;do{ids.push(i);i=nxt(g,i)}while(i!==g.turn);const hs=ids.map(i=>g.players[i].hand);ids.forEach((id,k)=>g.players[ids[(k+1)%ids.length]].hand=hs[k])}
  g.turn=nxt(g,g.turn,adv);
  if(v==='RL')g.pick={who:g.turn};
  mercy(g)}
 return g}

let peer=null,conns=[],hostConn=null;const PFX='unonm-';
try{uid=sessionStorage.getItem('unoUid')}catch(e){}
if(!uid){uid=Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('unoUid',uid)}catch(e){}}
const bcast=()=>conns.forEach(c=>c.open&&c.send(G));
function hostRecv(c,m){if(m.t==='join'){const ex=G.players.find(p=>p.id===m.id);
  if(!ex){if(G.phase!=='lobby'){c.send({err:'Game already started'});return}if(G.players.length>=10){c.send({err:'Game full'});return}
   G.players.push({id:m.id,name:String(m.name).slice(0,14),hand:[],out:0})}}
 else if(m.t==='act')G=apply(G,m.id,m.a);render();bcast()}
function send(a){if(!G)return;if(G.host===uid){G=apply(G,uid,a);render();bcast()}else if(hostConn&&hostConn.open)hostConn.send({t:'act',id:uid,a})}
function create(){if(!name.trim())return;try{localStorage.setItem('unoName',name)}catch(e){}
 code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');msg='Creating…';render();
 peer=new Peer(PFX+code);
 peer.on('open',()=>{msg='';G={phase:'lobby',host:uid,players:[{id:uid,name:name.trim(),hand:[],out:0}],log:[]};render()});
 peer.on('connection',c=>{conns.push(c);c.on('data',m=>hostRecv(c,m));c.on('open',()=>c.send(G))});
 peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();create()}else{msg='Network error: '+e.type;render()}})}
function join(c){if(!name.trim()||!c)return;code=c.toUpperCase().trim();try{localStorage.setItem('unoName',name)}catch(e){}
 msg='Joining…';render();peer=new Peer();
 peer.on('open',()=>{hostConn=peer.connect(PFX+code,{reliable:true});
  hostConn.on('open',()=>hostConn.send({t:'join',id:uid,name:name.trim()}));
  hostConn.on('data',m=>{if(m.err){msg=m.err;code='';G=null}else{msg='';G=m}render()});
  hostConn.on('close',()=>{msg='Host disconnected';code='';G=null;render()})});
 peer.on('error',e=>{msg=e.type==='peer-unavailable'?'No game with code '+code:'Network error: '+e.type;code='';G=null;render()})}
function start(){startGame(G);render();bcast()}
function again(){G.players=G.players.map(p=>({...p,hand:[],out:0}));startGame(G);render();bcast()}

function cardEl(card,cls=''){const[c,v]=P(card);return `<div class="c ${c} ${cls}">${LAB[v]||v}</div>`}
function ask(html){$('ov').innerHTML='<div class="ov"><div>'+html+'</div></div>'}
function closeOv(){$('ov').innerHTML=''}
function clickCard(i){const me=G.players.find(p=>p.id===uid),card=me.hand[i];
 if(G.players[G.turn].id!==uid||!canPlay(G,card))return;const v=P(card)[1],c=P(card)[0];
 const col=()=>ask('<h3>Pick a colour</h3>'+Object.keys(COL).map(k=>`<button class="cb" style="background:var(--${k})" onclick="closeOv();send({t:'play',i:${i},col:'${k}'})"></button>`).join(''));
 if(v==='7'){ask('<h3>Swap hands with…</h3>'+G.players.map((p,k)=>p.id===uid||p.out?'':`<div><button style="margin:4px;width:100%" onclick="closeOv();send({t:'play',i:${i},tgt:${k}})">${esc(p.name)} (${p.hand.length})</button></div>`).join(''))}
 else if(c==='W'&&v!=='RL')col();else send({t:'play',i:i})}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){const A=$('app'); if(!code||!G){A.innerHTML=`<div class="card-box"><div class="mut">Your name</div><input id="nm" maxlength="14" value="${esc(name)}" oninput="name=this.value">
 <button class="pri" style="width:100%;margin-top:6px" onclick="create()">Create new game</button></div>
 <div class="card-box"><div class="mut">Or join a friend's game</div><input id="cd" maxlength="4" placeholder="CODE" value="${esc((location.hash||'').slice(1).toUpperCase().slice(0,4))}" style="text-transform:uppercase;text-align:center;font-size:24px;letter-spacing:6px">
 <button style="width:100%" onclick="join($('cd').value)">Join</button></div><div class="mut">${esc(msg)}</div>
 <div class="card-box mut">Rules: stack draw cards (+2/+4/+6/+10, same or higher). Draw until you can play. Reach 25 cards and you're out. 7 swaps hands, 0 rotates hands. ✖ dumps all cards of that colour. ⊘⊘ skips everyone. 🎨 Roulette: next player names a colour and draws until they hit it.</div>`;return}
 if(G.phase==='lobby'){const host=G.host===uid;A.innerHTML=`<div class="card-box"><div class="mut" style="text-align:center">Game code — tell your friends</div><div class="code">${code}</div></div>
 <div class="card-box"><b>Players (${G.players.length})</b>${G.players.map(p=>`<div>• ${esc(p.name)}${p.id===G.host?' 👑':''}</div>`).join('')}</div>
 ${host?`<button class="pri" style="width:100%" ${G.players.length<2?'disabled':''} onclick="start()">Start game</button>`:'<div class="mut" style="text-align:center">Waiting for host to start…</div>'}`;return}
 const me=G.players.find(p=>p.id===uid),cur=G.players[G.turn],mine=cur.id===uid&&G.phase==='play',top=G.disc[G.disc.length-1];
 let info='';
 if(G.phase==='over'){const w=G.players.find(p=>p.id===G.winner);info='🏆 '+esc(w.name)+' wins!'}
 else if(G.pick){const pk=G.players[G.pick.who];info=pk.id===uid?'You must pick a colour and draw until you hit it!':esc(pk.name)+' is picking a colour…'}
 else if(mine)info=G.pend?`You must stack a +${G.pendVal}+ or draw ${G.pend}`:'Your turn';
 else info=esc(cur.name)+"'s turn"+(G.pend?` (draw ${G.pend} pending)`:'');
 const hasPlay=me&&!me.out&&me.hand.some(c=>canPlay(G,c));
 A.innerHTML=`<div class="opps">${G.players.map((p,k)=>`<div class="opp ${k===G.turn&&G.phase==='play'?'turn':''} ${p.out?'out':''} ${p.hand.length>=20?'warn':''}">${esc(p.name)}${p.id===uid?' (you)':''} <b>${p.out?'💀':p.hand.length}</b></div>`).join('')}</div>
 <div class="table"><div class="c back big" ${mine&&G.pend&&!hasPlay?'':''}>NO<br>MERCY</div>${cardEl(top,'big')}<div style="text-align:center"><span class="dot" style="background:var(--${G.color})"></span><div class="mut">${COL[G.color]}</div><div class="mut">${G.dir>0?'↻':'↺'}</div></div></div>
 <div class="info">${info}</div>
 ${G.pick&&G.players[G.pick.who].id===uid?'<div class="row">'+Object.keys(COL).map(k=>`<button class="cb" style="background:var(--${k});flex:none" onclick="send({t:'pickcol',col:'${k}'})"></button>`).join('')+'</div>':''}
 ${mine&&!G.pick&&(G.pend||!hasPlay)?`<button class="pri" style="width:100%;margin-bottom:10px" onclick="send({t:'draw'})">${G.pend?'Draw '+G.pend+' cards':'Draw until playable'}</button>`:''}
 ${me&&!me.out?`<div class="hand">${me.hand.map((c,i)=>({c,i})).sort((a,b)=>a.c<b.c?-1:1).map(o=>`<span onclick="clickCard(${o.i})">${cardEl(o.c,mine&&canPlay(G,o.c)?'ok':'no')}</span>`).join('')}</div><div class="mut" style="text-align:center;margin-top:6px">${me.hand.length} cards ${me.hand.length>=20?'⚠️ near elimination':''}</div>`:'<div class="info">You were eliminated 💀 – spectating</div>'}
 ${G.phase==='over'&&G.host===uid?'<button class="pri" style="width:100%;margin-top:10px" onclick="again()">Play again</button>':''}
 <div class="log">${G.log.slice(-6).reverse().map(esc).join('<br>')}</div>`}

render();
</script></body></html>
